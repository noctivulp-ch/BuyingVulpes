name: buying_vulpes
description: "Listas de compras por tienda, con precios, presupuesto y desglose en PDF."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4 # SQLite en Linux/Windows
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  pdf: ^3.12.0
  image_picker: ^1.2.3
  open_filex: ^4.7.0

  # La librería de diseño de la casa: laca, pozos, retícula y sus reglas.
  wulf_flutter:
    path: "../#Libs/wulfenite_ui/flutter"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
